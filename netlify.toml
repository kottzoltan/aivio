[build]
  command = "npm ci"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**"]
  external_node_modules = [
    "@google-cloud/datastore",
    "@google-cloud/firestore",
    "@google-cloud/secret-manager",
    "express",
    "openai",
    "serverless-http"
  ]

[build.environment]
  NODE_VERSION = "20"
  CORS_ORIGINS = "https://kaizo.hu,https://www.kaizo.hu,http://kaizo.hu,http://www.kaizo.hu,https://aivio3.netlify.app,http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500"

[functions.server]
  timeout = 26

# Static files in public/ are served first; API routes go to Express.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
