[build]
  command = "npm ci"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**"]
  external_node_modules = [
    "@google-cloud/datastore",
    "@google-cloud/firestore",
    "@google-cloud/secret-manager",
    "express",
    "openai",
    "serverless-http"
  ]

[build.environment]
  NODE_VERSION = "20"

[functions.server]
  timeout = 26

# Static files in public/ are served first; API routes go to Express.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
